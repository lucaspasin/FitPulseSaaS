name: Deploy FitPulse API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/lucaspasin/FitPulseSaaS
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitpulse-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fitpulse-api:latest

      - name: Azure login
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.AZURE_CONTAINER_APP || 'ca-fitpulse-api' }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ghcr.io/${{ github.repository_owner }}/fitpulse-api:${{ github.sha }} \
              --min-replicas 0 \
              --max-replicas 3
            az containerapp ingress update \
              --name ${{ vars.AZURE_CONTAINER_APP || 'ca-fitpulse-api' }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --target-port 4000

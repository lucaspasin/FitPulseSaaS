name: FitPulse SaaS CI/CD Deployment Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Compile Backend & Bundle Frontend
        run: npm run build

      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-production-dist
          path: frontend/dist

  deploy:
    name: Deploy to Azure Web App
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fitpulse-production-dist
          path: frontend/dist

      - name: Verify Build
        run: |
          echo "✅ Production artifacts verified successfully!"
          ls -la frontend/dist

      # -------------------------------------------------------------------------
      # AZURE WEB APP DEPLOYMENT (Using GitHub Secret: AZURE_WEBAPP_PUBLISH_PROFILE)
      # -------------------------------------------------------------------------
      # To deploy live to Azure:
      # 1. Download your Publish Profile from Azure Portal -> App Service -> Get Publish Profile
      # 2. Add it in GitHub: Settings -> Secrets and variables -> Actions -> Repository secret named AZURE_WEBAPP_PUBLISH_PROFILE
      # -------------------------------------------------------------------------
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fitpulse-saas' # Replace with your Azure Web App Name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
